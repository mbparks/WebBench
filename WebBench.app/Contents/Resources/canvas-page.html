<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Untitled canvas</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #fff; }
    body { position: relative; isolation: isolate; margin: 0; min-height: max(100vh, 960px); background: #fff; color: #192e2a; font: 18px/1.5 system-ui, sans-serif; }
    body > * { margin: 0; }
    h1, h2 { font: 500 44px/1.06 Georgia, serif; letter-spacing: -.035em; }
    button { background: #1b5847; color: white; border: 0; border-radius: 6px; padding: 12px 20px; font: 600 16px/1.25 system-ui, sans-serif; }
    input { padding: 8px; font: inherit; }
    a { color: #126052; }
    img { object-fit: cover; }
  </style>
  <style id="webbench-layout"></style>
</head>
<body data-free-page data-design-canvas></body>
</html>
