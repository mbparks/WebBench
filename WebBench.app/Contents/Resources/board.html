<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio board</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e8eee8; color: #173d31; font: 17px/1.5 system-ui, sans-serif; }
    main { position: relative; isolation: isolate; min-height: 740px; max-width: 1100px; margin: auto; background: #faf9f3; overflow: clip; }
    h1, p { margin: 0; }
    h1 { font: 600 clamp(40px, 6vw, 76px)/1.08 Georgia, serif; letter-spacing: -.045em; }
    p { width: min(360px, calc(100% - 64px)); color: #415a4c; }
  </style>
</head>
<body>
  <main data-design-canvas aria-label="Studio board">
    <div aria-hidden="true" style="position: absolute; left: 32px; top: 48px; width: 72px; height: 8px; background-color: #b28a47;"></div>
    <h1 style="position: absolute; left: 32px; top: 80px;">Studio notes</h1>
    <p style="position: absolute; left: 32px; top: 192px;">A page for sketches, field observations, and ideas from the workshop.</p>
  </main>
</body>
</html>
