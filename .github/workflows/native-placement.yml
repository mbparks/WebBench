name: Native canvas placement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal WebBench
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -project WebBench.xcodeproj -scheme WebBench -configuration Release -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/product" ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" || { grep -E '(error:|warning:)' "$RUNNER_TEMP/build.log" | sort -u; exit 1; }
          app="$RUNNER_TEMP/product/Build/Products/Release/WebBench.app"
          codesign --force --sign - --options runtime "$app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/WebBench"
          # UI automation launches the exact release bundle that goes into the download.
          rm -rf WebBench.app
          ditto "$app" WebBench.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/WebBench.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: WebBench-macOS
          path: ${{ runner.temp }}/WebBench.zip
      - name: Test installed canvas
        run: |
          set -o pipefail
          xcodebuild test -project WebBench.xcodeproj -scheme WebBench -destination 'platform=macOS' -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/tests" -resultBundlePath "$RUNNER_TEMP/Placement.xcresult" -only-testing:WebBenchMacTests/WebBenchMacTests/testPaletteButtonPreviewFromNativeWindow -only-testing:WebBenchUITests/PaletteUITests/testFirstButtonFromPackagedApp 2>&1 | tee "$RUNNER_TEMP/placement.log"
          grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/placement.log"
      - name: Verify source and storage round trips
        run: |
          swift test --scratch-path "$RUNNER_TEMP/Storage"
          node --test Tests/*.test.cjs
          node Tests/roundtrip.cjs
      - name: Run the disposable acceptance projects
        if: always()
        run: |
          set -o pipefail
          xcodebuild test -project WebBench.xcodeproj -scheme WebBench -destination 'platform=macOS' -parallel-testing-enabled NO -derivedDataPath "$RUNNER_TEMP/tests" -resultBundlePath "$RUNNER_TEMP/Samples.xcresult" -only-testing:WebBenchMacTests/WebBenchMacTests/testPackagedSampleWorkflowChecks 2>&1 | tee "$RUNNER_TEMP/samples.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-placement-results
          path: |
            ${{ runner.temp }}/samples.log
            ${{ runner.temp }}/placement.log
            ${{ runner.temp }}/Placement.xcresult
